name: Build JARVIS v2.8 TITAN+
on:
  push:
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Check SDK
        run: ls -l $ANDROID_SDK_ROOT/platforms/android-34 2>/dev/null || echo "SDK 34 MISSING"
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --info --stacktrace --console=plain
